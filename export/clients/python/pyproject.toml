[project]
name = "eyewear-fit-client"
version = "1.0.0"
description = "Thin httpx client for eyewear-fit-api"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["eyewear_fit_client"]
