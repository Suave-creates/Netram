<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Natalia Matcher</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260620-landing2">
  </head>
  <body>
    <main class="app-shell matcher-shell">
      <header class="toolbar" aria-label="Matcher toolbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-model">
            <a class="app-name brand-home-link" href="/">Natalia</a>
            <select id="modelSelect" class="model-select" aria-label="Frame model">
              <option>VC S19003</option>
            </select>
            <span id="pageState">Loading</span>
          </div>
        </div>

        <a class="action-button toolbar-link" href="/">Menu</a>
        <a id="labellerLink" class="action-button toolbar-link" href="/labeller">Labeller</a>
        <a id="matcherConfiguratorLink" class="action-button toolbar-link" href="/configurator">Configurator</a>
        <a id="lenskartMatcherLink" class="action-button toolbar-link" href="/lenskart-matcher">Lenskart</a>
        <a class="action-button toolbar-link" href="/parts?type=nose_bridge" hidden>Parts</a>
        <button id="frontViewButton" class="action-button" type="button">Front</button>
        <button id="shareFrontViewButton" class="action-button" type="button">Share</button>
        <button id="downloadFrontViewButton" class="action-button" type="button">Download</button>
      </header>

      <section class="matcher-workspace">
        <section class="matcher-preview" aria-label="3D beauty render">
          <div id="matcher3dPanel" class="frame3d-panel matcher-render-panel">
            <canvas id="matcher3dCanvas"></canvas>
            <div id="renderUnavailable" class="render-unavailable" hidden>3D unavailable</div>
            <div class="frame3d-meta" aria-label="3D render metadata">
              <span id="renderModel">VC S19003</span>
              <span>front view</span>
              <span>beauty_render.jpg</span>
            </div>
          </div>

          <section class="panel beauty-panel">
            <div class="panel-heading">
              <h2>Front view</h2>
              <span>JPG</span>
            </div>
            <div class="beauty-preview-wrap">
              <img id="beautyRenderPreview" alt="3D front view beauty render">
            </div>
          </section>
        </section>

        <aside class="inspector matcher-inspector" aria-label="Matcher inputs and results">
          <section id="matcherEnginePanel" class="panel matcher-engine-panel" data-collapsed="true">
            <button id="engineToggleButton" class="panel-heading panel-toggle" type="button" aria-expanded="false" aria-controls="matcherEngineBody">
              <h2>Engine</h2>
              <span id="engineToggleIcon" aria-hidden="true">+</span>
            </button>
            <div id="matcherEngineBody" class="matcher-form matcher-engine-body" hidden>
              <label class="field">
                <span>Matcher API</span>
                <input id="matcherApiBase" type="url" value="http://127.0.0.1:8000">
              </label>
              <label class="field">
                <span>Index path</span>
                <input id="indexPath" type="text" placeholder="/path/to/index/portfolio_index.pkl">
              </label>
            </div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>Inputs</h2>
              <span>mask</span>
            </div>
            <div class="matcher-form">
              <label class="field">
                <span>lens_mask.png</span>
                <input id="lensMask" type="file" accept="image/png,image/jpeg,image/webp">
                <small id="generatedLensMaskStatus" class="input-note">Generating front-view JPG</small>
              </label>
              <div class="dimension-grid">
                <label class="field">
                  <span>A size</span>
                  <input id="aSize" type="number" min="0" step="0.1" inputmode="decimal">
                </label>
                <label class="field">
                  <span>B size</span>
                  <input id="bSize" type="number" min="0" step="0.1" inputmode="decimal">
                </label>
                <label class="field">
                  <span>DBL</span>
                  <input id="dbl" type="number" min="0" step="0.1" inputmode="decimal">
                </label>
              </div>
              <div class="dimension-grid compact-grid">
                <label class="field">
                  <span>Top K</span>
                  <input id="topK" type="number" min="1" max="50" step="1" value="10">
                </label>
                <label class="check-field">
                  <input id="generateOverlay" type="checkbox">
                  <span>Overlay</span>
                </label>
              </div>
              <button id="runMatchButton" class="primary-button match-button" type="button">Run match</button>
            </div>
          </section>

          <section class="panel panel-flex matcher-results-panel">
            <div class="panel-heading">
              <h2>Matches</h2>
              <span id="matchCount">0</span>
            </div>
            <div id="matchResults" class="data-list match-results"></div>
          </section>
        </aside>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/three.module.js"
        }
      }
    </script>
    <script type="module" src="/static/matcher.js?v=20260620-landing2"></script>
  </body>
</html>
